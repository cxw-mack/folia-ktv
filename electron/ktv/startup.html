<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src file:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'" />
        <title>Folia KTV</title>
        <!-- A self-contained startup screen: no web server, fonts or application bundle required. -->
        <style>
            html, body { margin: 0; height: 100%; background: #09090b; color: #f4f4f5; }
            body { display: grid; place-items: center; font-family: 'Segoe UI', sans-serif; -webkit-app-region: drag; }
            main { display: flex; flex-direction: column; align-items: center; gap: 18px; }
            img { width: 88px; height: 88px; }
            h1 { margin: 0; font-size: 24px; font-weight: 550; letter-spacing: 0.08em; }
            .wave { display: flex; align-items: center; height: 24px; gap: 5px; margin-top: 6px; }
            .wave span { width: 3px; height: 100%; background: #a9bedf; transform: scaleY(0.25); animation: pulse 1100ms ease-in-out infinite; }
            .wave span:nth-child(2n) { animation-delay: -550ms; }
            .wave span:nth-child(3n) { animation-delay: -275ms; }
            .wave span:nth-child(5n) { animation-delay: -825ms; }
            @keyframes pulse { 50% { transform: scaleY(0.9); } }
            @media (prefers-reduced-motion: reduce) { .wave span { animation: none; } .wave span:nth-child(2n) { transform: scaleY(0.65); } }
        </style>
    </head>
    <body>
        <main role="status" aria-label="Folia KTV">
            <img id="logo" alt="" />
            <h1>Folia KTV</h1>
            <div class="wave" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
        </main>
        <script>
            document.getElementById('logo').src = new URLSearchParams(location.search).get('icon');
        </script>
    </body>
</html>
